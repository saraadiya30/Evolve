<body>
    <style>
        /* Layar tunggu statis: tampil segera saat HTML dimuat, sebelum skrip selesai. Seluruh body dikosongkan saat UI game dibangun. */
        .loading {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            color: #282828;
            font-family: Lato, "Helvetica Neue", Arial, sans-serif;
            z-index: 9999;
        }
        @media (prefers-color-scheme: dark) {
            .loading {
                background-color: #282828;
                color: #ebdbb2;
            }
        }
        .loading .loadingTitle {
            font-size: clamp(3rem, 18vw, 8rem);
            font-weight: bold;
            line-height: 1.1;
            letter-spacing: .05em;
        }
        .lds-dual-ring {
            display: inline-block;
            width: 64px;
            height: 64px;
            margin-top: 1.5rem;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 5rem;
            height: 5rem;
            margin: 1px;
            border-radius: 50%;
            border: 5px solid currentColor;
            border-color: currentColor transparent currentColor transparent;
            animation: lds-dual-ring 1.2s linear infinite;
            }
            @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="loading"><div class="loadingTitle">Evolve</div><div class="lds-dual-ring"></div></div>
